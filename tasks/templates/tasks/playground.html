<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Playground</title><link rel="stylesheet" href="/static/tasks/playground.css"></head><body><main><h1>AI Playground</h1><p class="intro">Run OpenAI, Gemini, or Poke Isaac through the secure Celery queue.</p><section id="auth"><h2>Sign in</h2><input id="token" type="password" placeholder="JWT access token"><button id="load">Load providers</button><small>Your token stays in this page only.</small></section><section id="app" hidden><label>Provider<select id="provider"></select></label><label>API key <span><input id="key" type="password" autocomplete="off" placeholder="Key is sent only to this backend"><button type="button" id="toggle">Show</button></span></label><button id="models" type="button">Load models</button><label>Model<select id="model"></select></label><label>Prompt<textarea id="prompt" rows="7" placeholder="What would you like to generate?"></textarea></label><details><summary>Optional parameters</summary><label>Temperature <input id="temperature" type="number" min="0" max="2" step="0.1"></label><label>Max tokens <input id="max_tokens" type="number" min="1" max="60000"></label></details><div class="actions"><button id="run">Run</button><button id="clear" type="button">Clear</button></div></section><section id="output" aria-live="polite"><p>Sign in to begin.</p></section></main><script src="/static/tasks/playground.js"></script></body></html>
