name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taskqueue_ci
          POSTGRES_USER: taskqueue
          POSTGRES_PASSWORD: taskqueue_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskqueue -d taskqueue_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-test-secret-key-not-for-production-please-do-not-use
      DEBUG: "False"
      DATABASE_URL: postgres://taskqueue:taskqueue_ci_password@localhost:5432/taskqueue_ci
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Django system checks
        run: python manage.py check
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --file /tmp/openapi-schema.yml
      - name: Build Docker image
        run: docker build --tag taskqueue-ci .
